<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Login | Green Life Lawn &amp; Landscaping</title>
  <link rel="icon" href="/images/favicon-48.png" type="image/png">
  <style>
    *{box-sizing:border-box;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0f0a;color:#f3f6ef;min-height:100vh;display:grid;place-items:center;padding:16px}
    .card{width:100%;max-width:380px;background:#141a12;border:1px solid #26321f;border-radius:16px;padding:32px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;font-weight:800;letter-spacing:.02em}
    .brand img{width:40px;height:40px}
    h1{font-size:20px;margin-bottom:6px}
    p{color:#a8b5a0;font-size:14px;margin-bottom:20px}
    label{display:block;font-size:13px;color:#a8b5a0;margin:14px 0 6px}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2f3d27;background:#0b0f0a;color:#fff;font-size:15px}
    input:focus{outline:2px solid #8be02b;border-color:transparent}
    button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:10px;background:#8be02b;color:#0b0f0a;font-weight:800;font-size:15px;cursor:pointer}
    .err{display:none;background:#3a1414;color:#ffb4b4;padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:8px}
  </style>
</head>
<body>
  <form class="card" method="POST" action="/admin/login">
    <div class="brand"><img src="/images/logo-round.png" alt="" style="border-radius:50%">GREEN LIFE · ADMIN</div>
    <h1>Lead Dashboard</h1>
    <p>Sign in to see and manage quote requests.</p>
    <div class="err" id="err">Wrong password.</div>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autofocus autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body>
</html>
